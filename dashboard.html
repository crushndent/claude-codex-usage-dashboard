<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLM Fuel</title>
<style>
:root{--bg:#0b1020;--panel:#141b2d;--line:#25304a;--text:#f2f5ff;--muted:#8995ae;--good:#57d9a3;--warn:#ffbc5e;--bad:#ff6577}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#172443 0,var(--bg) 35%);color:var(--text);font:15px system-ui,sans-serif;min-height:100vh}main{max-width:1200px;margin:auto;padding:36px 22px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}h1{margin:0;font-size:clamp(30px,5vw,54px);letter-spacing:-.05em}header p,.detail{color:var(--muted)}button{background:#202b45;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:15px}.card{background:linear-gradient(145deg,#172139,var(--panel));border:1px solid var(--line);border-radius:16px;padding:20px;min-height:190px;box-shadow:0 12px 30px #0004}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.name{font-size:23px;font-weight:750}.age,.badge{font-size:12px;color:var(--muted)}.badge{border:1px solid var(--line);border-radius:99px;padding:4px 8px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}.label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.09em}.value{font-size:35px;font-weight:800;margin:4px 0}.bar{height:7px;background:#27314a;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--good);border-radius:10px}.reset{font-size:11px;color:var(--muted);margin-top:7px}.balance{font-size:48px;font-weight:850;margin:28px 0 3px}.unavailable{color:var(--warn);font-size:19px;margin:30px 0 10px}.foot{margin-top:24px;color:var(--muted);font-size:12px}@media(max-width:500px){header{align-items:start;gap:18px}.grid{grid-template-columns:1fr}.metrics{gap:9px}}
.account{color:var(--muted);font-size:13px;margin-top:3px}
.titlebar{position:fixed;inset:0 auto 0 0;width:64px;border-right:1px solid var(--line);background:#0c1324;display:flex;align-items:center;justify-content:center;z-index:2}.titlebar h1{font-size:28px;letter-spacing:.08em;white-space:nowrap;transform:rotate(-90deg)}main{max-width:none;height:100vh;margin-left:64px;padding:10px 14px;display:flex;flex-direction:column}header{flex:0 0 auto;margin:0 0 7px;align-items:center}header p{margin:0;font-size:clamp(14px,1.2vw,17px)}.grid{flex:1;min-height:0;grid-template-columns:repeat(4,minmax(220px,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(9px,.8vw,14px)}.card{container-type:inline-size;min-height:0;padding:clamp(14px,1.25vw,20px);border-radius:14px;overflow:hidden}.name{font-size:clamp(22px,7cqi,29px)}.account{font-size:clamp(12px,3.7cqi,15px);line-height:1.25}.metrics{margin-top:clamp(10px,1.2vh,16px);gap:clamp(8px,3cqi,15px)}.label{font-size:clamp(12px,3.7cqi,15px)}.value{font-size:clamp(36px,13cqi,54px)}.reset{font-size:clamp(11px,3.4cqi,14px);margin-top:5px}.balance{font-size:clamp(44px,15cqi,60px);margin:clamp(16px,2vh,24px) 0 3px}.unavailable{font-size:clamp(18px,5.5cqi,23px);margin:clamp(15px,2vh,24px) 0 7px}.detail{font-size:clamp(12px,3.5cqi,14px);line-height:1.3}.foot{flex:0 0 auto;margin-top:5px;font-size:12px}
.card{cursor:grab;transition:opacity .15s ease,transform .15s ease,border-color .15s ease}.card:active{cursor:grabbing}.card.dragging{opacity:.35;transform:scale(.98)}.card.drag-over{border-color:var(--good)}
@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(210px,1fr));grid-template-rows:repeat(3,minmax(190px,1fr))}main{height:auto;min-height:100vh}.grid{flex:none}.card{overflow:visible}}
@media(max-width:760px){.titlebar{position:static;width:auto;height:46px;border-right:0;border-bottom:1px solid var(--line)}.titlebar h1{font-size:20px;transform:none}main{margin-left:0;padding:10px;height:auto}.grid{grid-template-columns:repeat(2,minmax(210px,1fr));grid-template-rows:none}}
@media(max-width:500px){.grid{grid-template-columns:1fr}.card{min-height:180px}header{align-items:center}}
.pace{display:flex;justify-content:space-between;gap:6px;font-size:clamp(11px,3.4cqi,14px);color:var(--muted);margin-top:6px}.bar.time{height:4px;margin-top:3px}.bar.time i{background:#8995ae}.stale{color:var(--warn);font-size:clamp(12px,3.5cqi,14px);margin-top:6px}.models{color:var(--muted);font-size:clamp(10px,3cqi,12px);line-height:1.25;margin-top:5px}.dim{opacity:.45}
.trend{margin-top:10px}.spark{display:block;width:100%;height:44px;margin-top:4px;background:rgba(255,255,255,.02);border-bottom:1px solid var(--line)}.spark-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:2px}

.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{background:transparent;border-color:transparent;color:var(--muted);padding:7px 12px}.tabs button.on{background:#202b45;border-color:var(--line);color:var(--text)}header{gap:12px}header p{flex:1;text-align:right}
body:not([data-tab=fuel]) main{height:auto;min-height:100vh}.view{display:none}body[data-tab=fuel] .grid{display:grid}body[data-tab=activity] [data-view=activity],body[data-tab=local] [data-view=local],body[data-tab=hindsight] [data-view=hindsight]{display:grid}body[data-tab=headroom] [data-view=headroom]{display:flex}
.panels{grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px;align-items:start}.panel{background:linear-gradient(145deg,#172139,var(--panel));border:1px solid var(--line);border-radius:14px;padding:16px}.panel.wide{grid-column:1/-1}.panel h2{margin:0 0 10px;font-size:19px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}.panel h2 small{font-size:12px;color:var(--muted);font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:10px}.kpi .label{font-size:11px}.kpi .v{font-size:26px;font-weight:800;margin-top:2px}.kpi .s{font-size:12px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:13px}.t th{color:var(--muted);font-weight:500;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:4px 6px;border-bottom:1px solid var(--line)}.t td{padding:4px 6px;border-bottom:1px solid #1d2740;font-variant-numeric:tabular-nums}.t td.n,.t th.n{text-align:right}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 46px;gap:8px;align-items:center;font-size:13px;margin:3px 0}.hbar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hbar .bar{height:8px}.hbar b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}.ok{background:var(--good)}.down{background:var(--bad)}.deg{background:var(--warn)}
.hours{display:flex;align-items:end;gap:2px;height:46px;margin-top:6px}.hours i{flex:1;background:#3d6fd1;border-radius:2px 2px 0 0;min-height:1px}.chart-sub{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.hrview{flex-direction:column;gap:8px;flex:1;min-height:calc(100vh - 90px)}.hrview .bar2{display:flex;gap:6px;align-items:center}.hrview iframe{flex:1;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;min-height:calc(100vh - 140px)}.muted{color:var(--muted)}a{color:#8fb4ff}
</style></head><body><aside class="titlebar"><h1>LLM Fuel</h1></aside><main><header><nav class="tabs" id="tabs"><button data-tab="fuel">Fuel</button><button data-tab="activity">Activity</button><button data-tab="local">Local LLM</button><button data-tab="hindsight">Hindsight</button><button data-tab="headroom">Headroom</button></nav><p id="subtitle">Remaining capacity across your coding agents</p><button id="refresh">Refresh</button></header><div class="grid view" id="grid" data-view="fuel"></div><div class="view panels" data-view="activity" id="v-activity"></div><div class="view panels" data-view="local" id="v-local"></div><div class="view panels" data-view="hindsight" id="v-hindsight"></div><div class="view hrview" data-view="headroom" id="v-headroom"></div><div class="foot" id="foot">Loading…</div></main>
<script>
const grid=document.querySelector('#grid'),foot=document.querySelector('#foot');
const ORDER_KEY='llm-fuel-card-order-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const age=t=>{if(!t)return'no data';const m=Math.max(0,Math.floor((Date.now()-t)/60000));return m<120?m+'m old':m<2880?Math.floor(m/60)+'h old':Math.floor(m/1440)+'d old'};
const reset=t=>{if(!t)return'reset unknown';const moreThanDay=t-Date.now()>86400000;return'resets '+new Intl.DateTimeFormat('en-US',moreThanDay?{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}:{hour:'numeric',minute:'2-digit'}).format(new Date(t))};
const HOUR=3600000,DEFAULT_WINDOW={'5 hour':5*HOUR,'Weekly':7*24*HOUR};
const windowLabel=(label,ms)=>!ms?label:ms%(24*HOUR)===0?(ms===7*24*HOUR?'Weekly':ms/(24*HOUR)+' day'):ms/HOUR+' hour';
function pace(w,ms){if(!ms||!w.resetAt)return'';const timeLeft=Math.max(0,Math.min(100,(w.resetAt-Date.now())/ms*100)),diff=w.remainingPercent-timeLeft,color=diff>=0?'var(--good)':diff>=-10?'var(--warn)':'var(--bad)';return `<div class="pace"><span>time left ${Math.round(timeLeft)}%</span><strong style="color:${color}">${diff>=0?'+':''}${Math.round(diff)} ${diff>=0?'ahead':'behind'}</strong></div><div class="bar time"><i style="width:${timeLeft}%"></i></div>`}
function metric(label,w,models){if(!w)return `<div><div class="label">${label}</div><div class="value">—</div><div class="reset">not exposed</div></div>`;const ms=w.windowMs||DEFAULT_WINDOW[label],n=Math.round(w.remainingPercent),color=n<20?'var(--bad)':n<=50?'var(--warn)':'var(--good)',passed=w.resetAt&&w.resetAt<Date.now();const list=models?.length?`<div class="models">${models.map(esc).join(', ')}</div>`:'';if(passed)return `<div><div class="label">${esc(label)}</div><div class="value dim">${n}%</div><div class="bar dim"><i style="width:${n}%;background:${color}"></i></div><div class="reset" style="color:var(--warn)">reset ${new Date(w.resetAt).toLocaleDateString([],{month:'short',day:'numeric'})} has passed, probably refilled</div>${list}</div>`;return `<div><div class="label">${esc(windowLabel(label,w.windowMs))}</div><div class="value" style="color:${color}">${n}%</div><div class="bar"><i style="width:${n}%;background:${color}"></i></div>${pace(w,ms)}<div class="reset">${reset(w.resetAt)}</div>${list}</div>`}
function spark(points,from,to){const vs=points.map(x=>x[1]),lo=Math.min(...vs),hi=Math.max(...vs),span=hi-lo||1,W=200,H=44;const X=t=>((t-from)/(to-from)*W).toFixed(1),Y=v=>(H-3-(v-lo)/span*(H-6)).toFixed(1);let d='';points.forEach((x,i)=>{const t=Math.max(x[0],from);d+=i?`H${X(t)}V${Y(x[1])}`:`M${X(t)},${Y(x[1])}`});d+=`H${W}`;return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="7 day balance"><path d="${d}" fill="none" stroke="var(--good)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg><div class="spark-axis"><span>$${hi.toFixed(2)}</span><span>$${lo.toFixed(2)}</span></div>`}
function trend(t){if(!t)return'';const now=Date.now(),from=now-t.windowMs;if(!Number.isFinite(t.spent))return `<div class="trend"><div class="label">7 day trend</div><div class="reset">collecting balance history${t.since?' since '+new Date(t.since).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''}…</div></div>`;const days=t.coveredMs/86400000,partial=days<6.95,pct=t.spentPercent,color=pct>=30?'var(--bad)':pct>=10?'var(--warn)':'var(--good)';const fmtDays=d=>d<1?Math.round(d*24)+'h':d.toFixed(1)+'d';return `<div class="trend"><div class="label">${partial?'Last '+fmtDays(days)+' (of 7d)':'Last 7 days'}</div>${spark(t.points,from,now)}<div class="pace"><span>spent</span><strong style="color:${color}">−$${t.spent.toFixed(2)} · ${pct.toFixed(1)}%</strong></div><div class="pace"><span>burn</span><strong>${Number.isFinite(t.perDay)?`$${t.perDay.toFixed(2)}/day${t.daysLeft?' · ~'+Math.round(t.daysLeft)+'d left':''}`:'needs 1h of data'}</strong></div>${t.added>0.005?`<div class="reset">+$${t.added.toFixed(2)} topped up in window</div>`:''}</div>`}
function card(p){let body;if(p.status==='unavailable')body=`<div class="unavailable">No live balance</div><div class="detail">${esc(p.detail)}</div>`;else if(p.kind==='pools'){body=`<div class="metrics">${p.pools.slice(0,4).map(x=>metric(x.name,x,x.models)).join('')}</div>`;if(p.promptCredits)body+=`<div class="detail" style="margin-top:9px">Prompt credits · <strong>${p.promptCredits.remaining.toLocaleString()}</strong>${Number.isFinite(p.promptCredits.monthly)?` of ${p.promptCredits.monthly.toLocaleString()}`:''}</div>`;if(p.fetchedAt&&Date.now()-p.fetchedAt>3600000)body=`<div class="stale">Snapshot from ${new Date(p.fetchedAt).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}. Open Antigravity to refresh it.</div>`+body;if(p.aiCredits?.length)body+=`<div class="detail">AI credits · ${p.aiCredits.map(x=>`${esc(x.type)}: <strong>${x.amount.toLocaleString()}</strong>`).join(' · ')}</div>`}else if(p.kind==='quota'){let overage='';if(p.extraUsage){const state=p.extraUsage.enabled?'ON':'OFF';const amount=Number.isFinite(p.extraUsage.remaining)?` · <strong>$${p.extraUsage.remaining.toFixed(2)} remaining</strong>${Number.isFinite(p.extraUsage.monthlyLimit)?` of $${p.extraUsage.monthlyLimit.toFixed(2)} · $${p.extraUsage.used.toFixed(2)} used`:''}`:' · balance not reported while off';overage=`<div class="detail" style="margin-top:11px">Extra Usage <strong>${state}</strong>${amount}${p.extraUsage.disabledReason?' · '+esc(p.extraUsage.disabledReason):''}</div>`;if(Number.isFinite(p.creditBalance))overage+=`<div class="detail">Credit balance · <strong>$${p.creditBalance.toFixed(2)}</strong></div>`;(p.creditPools||[]).forEach(c=>{overage+=`<div class="detail">Credit grant · <strong>$${c.remaining.toFixed(2)} left</strong> of $${c.limit.toFixed(2)}${c.resetAt?' · '+reset(c.resetAt).replace('resets','expires'):''}${c.locked?' · '+esc(c.locked):''}</div>`})}else if(p.extraCredits){const state=p.extraCredits.enabled?'ON':'OFF',amount=Number.isFinite(p.extraCredits.balance)?`$${p.extraCredits.balance.toFixed(2)}`:'unavailable';overage=`<div class="detail" style="margin-top:11px">Extra credits <strong>${state}</strong> · <strong>${amount} remaining</strong>${p.extraCredits.limitReached?' · limit reached':''}</div>`}else if(Number.isFinite(p.overageRemaining))overage=`<div class="detail" style="margin-top:11px">Overage credits remaining · <strong>$${p.overageRemaining.toFixed(2)}</strong></div>`;const fiveIsWeekly=p.five?.windowMs>=24*HOUR&&!p.weekly;body=`<div class="metrics">${metric('5 hour',p.five)}${fiveIsWeekly?'':metric('Weekly',p.weekly)}</div>${overage}`}else body=`<div class="balance">${p.unit==='USD'?'$':''}${Number(p.remaining).toLocaleString(undefined,{maximumFractionDigits:2})}${p.unit==='USD'?'':' '+esc(p.unit)}</div><div class="detail">remaining ${p.detail?'· '+esc(p.detail):''}</div>${trend(p.trend)}`;const warning=p.warning?`<div class="detail" style="margin-top:8px;color:var(--warn)">${esc(p.warning)}</div>`:'';return `<section class="card" draggable="true" data-card-id="${esc(p.id)}"><div class="top"><div><div class="name">${esc(p.name)}</div>${p.account?`<div class="account">${esc(p.account)}</div>`:''}</div><div><span class="badge">${p.kind==='quota'||p.kind==='pools'?'quota':'credits'}</span> <span class="age">${age(p.fetchedAt)}</span></div></div>${body}${warning}</section>`}
function savedOrder(){try{const value=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]');return Array.isArray(value)?value:[]}catch{return[]}}
function ordered(providers){const order=savedOrder(),rank=new Map(order.map((id,i)=>[id,i]));return [...providers].sort((a,b)=>(rank.get(a.id)??1e6)-(rank.get(b.id)??1e6))}
function saveOrder(){localStorage.setItem(ORDER_KEY,JSON.stringify([...grid.querySelectorAll('.card')].map(x=>x.dataset.cardId)))}
function enableDragging(){let dragged=null;grid.querySelectorAll('.card').forEach(el=>{el.addEventListener('dragstart',e=>{dragged=el;el.classList.add('dragging')});el.addEventListener('dragend',()=>{el.classList.remove('dragging');grid.querySelectorAll('.card').forEach(x=>x.classList.remove('drag-over'));saveOrder();dragged=null});el.addEventListener('dragover',e=>{e.preventDefault();if(!dragged||dragged===el)return;el.classList.add('drag-over');const box=el.getBoundingClientRect(),before=e.clientY<box.top+box.height/2||(Math.abs(e.clientY-(box.top+box.height/2))<box.height/3&&e.clientX<box.left+box.width/2);grid.insertBefore(dragged,before?el:el.nextSibling)});el.addEventListener('dragleave',()=>el.classList.remove('drag-over'))});}
async function load(){foot.textContent='Refreshing…';try{const r=await fetch('/api/usage',{cache:'no-store'}),d=await r.json();grid.innerHTML=ordered(d.providers).map(card).join('');enableDragging();foot.textContent='Last checked '+new Date(d.generatedAt).toLocaleString()+' · drag cards to save their order';clearTimeout(window.timer);if(tab==='fuel')window.timer=setTimeout(load,d.refreshMs)}catch(e){foot.textContent='Refresh failed: '+e.message}}
const $=(sel)=>document.querySelector(sel);
const fmtN=n=>n==null||!Number.isFinite(+n)?'—':Math.abs(n)>=1e9?(n/1e9).toFixed(2)+'B':Math.abs(n)>=1e6?(n/1e6).toFixed(1)+'M':Math.abs(n)>=1e4?(n/1e3).toFixed(1)+'k':Math.round(n).toLocaleString();
const fmt$=n=>n==null?'—':'$'+(+n).toFixed(2),pct=n=>n==null?'—':(+n).toFixed(1)+'%',ms=n=>n==null?'—':n>=1000?(n/1000).toFixed(1)+'s':Math.round(n)+'ms';
const hhmm=t=>t?new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'—';
const dur=s=>s==null?'—':s<3600?Math.round(s/60)+'m':s<172800?(s/3600).toFixed(1)+'h':(s/86400).toFixed(1)+'d';
const kpi=(label,v,sub,color)=>`<div class="kpi"><div class="label">${label}</div><div class="v"${color?` style="color:${color}"`:''}>${v}</div>${sub?`<div class="s">${sub}</div>`:''}</div>`;
const hcolor=n=>n==null?'':n>=80?'var(--good)':n>=50?'var(--warn)':'var(--bad)';
const bars=(rows,max)=>{max=max||Math.max(1,...rows.map(r=>r[1]));return rows.map(([k,v])=>`<div class="hbar"><span title="${esc(k)}">${esc(k)}</span><div class="bar"><i style="width:${v/max*100}%"></i></div><b>${fmtN(v)}</b></div>`).join('')};
function line(points,{w=300,h=50,color='var(--good)',fill=false}={}){points=points.filter(p=>p[1]!=null);if(points.length<2)return '<div class="muted" style="font-size:12px">collecting…</div>';const xs=points.map(p=>p[0]),ys=points.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(0,...ys),y1=Math.max(...ys)||1;const X=x=>((x-x0)/(x1-x0||1)*w).toFixed(1),Y=y=>(h-2-(y-y0)/(y1-y0||1)*(h-4)).toFixed(1);const d=points.map((p,i)=>(i?'L':'M')+X(p[0])+','+Y(p[1])).join('');return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">${fill?`<path d="${d}L${w},${h}L0,${h}Z" fill="${color}" opacity=".15"/>`:''}<path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`}
const status=(st)=>`<span class="dot ${st==='ok'?'ok':st==='down'?'down':'deg'}"></span>`;

function headroomPanel(h){if(h.status!=='ok')return `<section class="panel"><h2>${status('down')}Headroom · ${esc(h.name)} <small>:${h.port}</small></h2><div class="detail">${esc(h.error)}</div></section>`;
const pc=h.prefixCache[0]||{};const models=Object.entries(h.requests.byModel).filter(([k])=>!k.startsWith('passthrough')).sort((a,b)=>b[1]-a[1]);
return `<section class="panel"><h2><span>${status('ok')}Headroom · ${esc(h.name)}</span><small>:${h.port} · v${esc(h.version)} · up ${dur(h.uptimeS)} · <a href="#headroom" data-hr="${esc(h.name)}">full dashboard</a></small></h2>
<div class="kpis">${kpi('Prompt cache hit',pct(pc.hitRate),`${fmtN(pc.readTokens)} read · ${pc.busts??0} busts`,hcolor(pc.hitRate))}${kpi('Requests',fmtN(h.requests.total),`${h.requests.failed||0} failed · ${h.requests.rateLimited||0} rate-limited`)}${kpi('Tokens in / out',fmtN(h.tokens.input)+' / '+fmtN(h.tokens.output),`${fmtN(h.tokens.saved)} compressed away`)}${kpi('Cache saved',fmt$(pc.netSavingsUsd||h.cost.cacheDiscountUsd),`compression ${fmt$(h.cost.savedUsd)}`)}${kpi('Latency',ms(h.latency.avgMs),`TTFB ${ms(h.latency.ttfbMs)} · +${ms(h.latency.overheadMs)} proxy`)}${kpi('MCP results',fmtN((h.mcp.compressions||0)+(h.mcp.smallResults||0)),`${h.mcp.compressions||0} compressed · ${h.mcp.retrievals||0} retrieved`)}</div>
${models.length?`<div class="label">Requests by model</div>${bars(models.slice(0,5))}`:''}
<div class="label" style="margin-top:8px">Recent requests</div><table class="t"><tr><th>time</th><th>model</th><th class="n">in</th><th class="n">out</th><th class="n">saved</th><th class="n">latency</th><th>cache</th></tr>${h.recent.slice(0,8).map(r=>`<tr><td>${hhmm(r.t)}</td><td>${esc(r.model)}</td><td class="n">${fmtN(r.in)}</td><td class="n">${fmtN(r.out)}</td><td class="n">${fmtN(r.saved)}</td><td class="n">${ms(r.ms)}</td><td>${r.cacheHit==null?'':r.cacheHit?'hit':'miss'}</td></tr>`).join('')}</table>
<div class="detail" style="margin-top:8px">Lifetime: ${fmtN(h.lifetime.requests)} requests · ${fmtN(h.lifetime.tokensSaved)} tokens saved · cache ${fmt$(h.lifetime.cacheUsd)} + compression ${fmt$(h.lifetime.compressionUsd)} saved</div></section>`}
function toolsPanel(t){const mx=Math.max(1,...t.hourly);
return `<section class="panel"><h2><span>Tool calls · last 24h</span><small>${t.files} transcripts</small></h2><div class="kpis">${kpi('Tool calls',fmtN(t.total),t.bySource.map(([k,v])=>`${esc(k)} ${fmtN(v)}`).join(' · '))}${kpi('MCP calls',fmtN(t.mcpTotal),t.total?pct(t.mcpTotal/t.total*100)+' of calls':'')}${kpi('MCP servers used',t.mcp.length,'')}</div>
<div class="label">Per hour</div><div class="hours">${t.hourly.map(v=>`<i style="height:${v/mx*100}%" title="${v}"></i>`).join('')}</div><div class="chart-sub"><span>24h ago</span><span>now</span></div>
<div class="label" style="margin-top:10px">Top tools</div>${bars(t.top.slice(0,10))}
<div class="label" style="margin-top:10px">MCP servers</div>${t.mcp.length?t.mcp.map(s=>`<div class="hbar"><span>${esc(s.server)}</span><div class="bar"><i style="width:${s.calls/Math.max(...t.mcp.map(x=>x.calls))*100}%;background:#b48cff"></i></div><b>${s.calls}</b></div><div class="models" style="margin:0 0 6px">${s.tools.slice(0,6).map(([k,v])=>`${esc(k)} ${v}`).join(' · ')}</div>`).join(''):'<div class="detail">No MCP calls in the last 24h</div>'}</section>`}
function renderActivity(d){$('#v-activity').innerHTML=d.headroom.map(headroomPanel).join('')+toolsPanel(d.tools)}

function renderLocal(d){const lm=d.lmstudio,g=d.gpus[0]||{},s=d.series||[];const stat=(w,label)=>`<div class="kpis">${kpi(label+' requests',fmtN(w.requests),`${dur(w.busyS)} busy`)}${kpi('Prompt cache reuse',pct(w.cacheReusePct),`${fmtN(w.cachedTokens)} of ${fmtN(w.cachedTokens+w.promptTokens)} prompt tok`,hcolor(w.cacheReusePct==null?null:w.cacheReusePct+40))}${kpi('Generation',w.avgTgTps?w.avgTgTps.toFixed(1)+' t/s':'—',`${fmtN(w.genTokens)} tokens out`)}${kpi('Prompt processing',w.avgPpTps?fmtN(w.avgPpTps)+' t/s':'—',`${fmtN(w.promptTokens)} tokens in`)}</div>`;
$('#v-local').innerHTML=`<section class="panel"><h2><span>${status(lm.status)}LM Studio</span><small>${esc(lm.url)} · ${lm.available} models on disk</small></h2>${lm.status!=='ok'?`<div class="detail">${esc(lm.error)}</div>`:''}
<table class="t"><tr><th>loaded model</th><th>type</th><th>quant</th><th class="n">context</th></tr>${lm.loaded.map(m=>`<tr><td>${esc(m.id)}</td><td>${esc(m.type)}</td><td>${esc(m.quant||'')}</td><td class="n">${fmtN(m.ctx)} / ${fmtN(m.maxCtx)}</td></tr>`).join('')||'<tr><td colspan=4 class="muted">nothing loaded</td></tr>'}</table>
<div style="margin-top:12px">${stat(d.hour,'1h')}${stat(d.day,'24h')}</div>
<div class="label">Recent completions</div><table class="t"><tr><th>time</th><th class="n">prompt</th><th class="n">cached</th><th class="n">gen</th><th class="n">gen t/s</th><th class="n">total</th></tr>${d.recent.map(r=>`<tr><td>${hhmm(r.t)}</td><td class="n">${fmtN(r.prompt)}</td><td class="n">${fmtN(r.cached)}</td><td class="n">${fmtN(r.gen)}</td><td class="n">${r.tg?r.tg.toFixed(1):'—'}</td><td class="n">${ms(r.ms)}</td></tr>`).join('')}</table></section>
<section class="panel"><h2><span>${g.error?status('down'):status('ok')}GPU</span><small>${esc(g.name||'')}</small></h2>${g.error?`<div class="detail">${esc(g.error)}</div>`:`<div class="kpis">${kpi('Utilization',g.util+'%','',g.util>90?'var(--warn)':'')}${kpi('VRAM',(g.memUsed/1024).toFixed(1)+' GB',`of ${(g.memTotal/1024).toFixed(1)} GB · LM Studio ${(lm.vramMiB/1024).toFixed(1)} GB`)}${kpi('Power',Math.round(g.power)+' W',`limit ${Math.round(g.powerLimit)} W`)}${kpi('Temp',g.temp+'°C','')}</div>
<div class="label">GPU util · 24h</div>${line(s.map(x=>[x.t,x.gpu]),{fill:true})}<div class="label" style="margin-top:6px">VRAM MiB · 24h</div>${line(s.map(x=>[x.t,x.vram]),{color:'#b48cff'})}<div class="label" style="margin-top:6px">LM Studio completions / min</div>${line(s.map(x=>[x.t,x.lm]),{color:'#ffbc5e',fill:true})}
<div class="label" style="margin-top:10px">VRAM by process</div>${bars(g.apps.map(a=>[a.name,a.memMiB]).sort((a,b)=>b[1]-a[1]),g.memTotal)}`}
<div class="detail" style="margin-top:10px">Host load ${d.host.load.map(x=>x.toFixed(2)).join(' / ')} on ${d.host.cpus} threads · RAM ${(d.host.memUsed/2**30).toFixed(1)} of ${(d.host.memTotal/2**30).toFixed(1)} GB</div></section>`}

function renderHindsight(d){if(d.status==='down'){$('#v-hindsight').innerHTML=`<section class="panel"><h2>${status('down')}Hindsight</h2><div class="detail">${esc(d.error)}</div></section>`;return}
const tot=d.scopes.reduce((a,x)=>({calls:a.calls+x.calls,in:a.in+x.inTokens,out:a.out+x.outTokens,f:a.f+x.failed}),{calls:0,in:0,out:0,f:0});const errs=Object.values(d.httpErrors).reduce((a,b)=>a+b,0);
$('#v-hindsight').innerHTML=`<section class="panel"><h2><span>${status(d.status)}Hindsight memory</span><small>up ${dur(d.uptimeS)} · <a href="${esc(d.ui)}" target="_blank">open UI</a></small></h2>
<div class="kpis">${kpi('LLM calls',fmtN(tot.calls),`${tot.f} failed · ${Object.keys(d.models).map(esc).join(', ')}`)}${kpi('LLM tokens in / out',fmtN(tot.in)+' / '+fmtN(tot.out),'since container start')}${kpi('Docs retained',fmtN(d.retainedDocs),'')}${kpi('DB pool',`${d.health.db_pool_in_use??'—'}/${d.health.db_pool_max??'—'}`,`${d.health.db_pool_waiting??0} waiting · ${d.health.db_acquire_ms??'—'}ms acquire`)}${kpi('Container',d.container?d.container.cpu:'—',d.container?`${esc(d.container.mem)}`:'docker stats unavailable')}${kpi('HTTP errors',fmtN(errs),Object.entries(d.httpErrors).map(([k,v])=>`${k} ${v}`).join(' · '),errs?'var(--warn)':'')}</div>
<div class="label">LLM work by operation</div><table class="t"><tr><th>scope</th><th class="n">calls</th><th class="n">in tok</th><th class="n">out tok</th><th class="n">avg time</th><th class="n">failed</th></tr>${d.scopes.map(x=>`<tr><td>${esc(x.scope)}</td><td class="n">${fmtN(x.calls)}</td><td class="n">${fmtN(x.inTokens)}</td><td class="n">${fmtN(x.outTokens)}</td><td class="n">${x.avgS==null?'—':x.avgS.toFixed(1)+'s'}</td><td class="n">${x.failed}</td></tr>`).join('')}</table></section>
<section class="panel"><h2>Operations &amp; API</h2><div class="label">Operations run</div>${bars(Object.entries(d.operations).sort((a,b)=>b[1]-a[1]))}<div class="label" style="margin-top:10px">API endpoints hit</div>${bars(d.endpoints.map(([k,v])=>[k.replace('/v1/default/banks/{bank_id}',''),v]))}</section>`}

let hrInstance=localStorage.getItem('llm-fuel-hr')||'claude';
function renderHeadroom(){const names=['claude','hermes'];const v=$('#v-headroom');if(v.dataset.inst===hrInstance)return;v.dataset.inst=hrInstance;v.innerHTML=`<div class="bar2">${names.map(n=>`<button data-hr="${n}" class="${n===hrInstance?'on':''}">${n}</button>`).join('')}<a href="/hr/${hrInstance}/dashboard" target="_blank" class="muted" style="margin-left:auto;font-size:12px">open in new tab</a></div><iframe src="/hr/${hrInstance}/dashboard" title="Headroom ${hrInstance}"></iframe>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-hr]');if(!b)return;e.preventDefault();hrInstance=b.dataset.hr;localStorage.setItem('llm-fuel-hr',hrInstance);$('#v-headroom').dataset.inst='';setTab('headroom')});

const SUB={fuel:'Remaining capacity across your coding agents',activity:'Proxies, prompt caching, tool and MCP calls',local:'LM Studio throughput, prompt cache and GPU',hindsight:'Hindsight memory server workload',headroom:'Headroom proxy dashboard (read-only)'};
const VIEW={activity:['/api/activity',renderActivity],local:['/api/local',renderLocal],hindsight:['/api/hindsight',renderHindsight]};
let tab='fuel';
async function loadTab(){clearTimeout(window.timer);if(tab==='fuel')return load();if(tab==='headroom'){renderHeadroom();foot.textContent='Headroom dashboard via read-only proxy';return}const [url,render]=VIEW[tab];foot.textContent='Refreshing…';try{const d=await (await fetch(url,{cache:'no-store'})).json();if(d.error)throw new Error(d.error);render(d);foot.textContent='Last checked '+new Date(d.generatedAt).toLocaleString()}catch(e){foot.textContent='Refresh failed: '+e.message}window.timer=setTimeout(loadTab,tab==='local'?10000:20000)}
function setTab(t){tab=VIEW[t]||t==='fuel'||t==='headroom'?t:'fuel';document.body.dataset.tab=tab;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));$('#subtitle').textContent=SUB[tab];if(location.hash.slice(1)!==tab)history.replaceState(null,'','#'+tab);loadTab()}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)};
document.querySelector('#refresh').onclick=()=>{if(tab==='headroom'){$('#v-headroom').dataset.inst=''}loadTab()};setTab(location.hash.slice(1)||'fuel');window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==tab)setTab(h)});
</script></body></html>
